<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1B2B4B">
<title>{% block title %}Pulso Gestão{% endblock %}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #f0f2f5; color: #1B2B4B; min-height: 100vh }

  .header {
    background: #1B2B4B; padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2)
  }
  .header-logo { color: #E8A84C; font-size: 18px; font-weight: 800 }
  .header-sub  { color: rgba(255,255,255,0.6); font-size: 12px }

  .container { max-width: 600px; margin: 0 auto; padding: 20px 16px }

  .card {
    background: white; border-radius: 16px;
    padding: 24px 20px; margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06)
  }

  .btn {
    display: block; width: 100%; padding: 16px;
    background: #E8A84C; color: #1B2B4B;
    font-size: 16px; font-weight: 700;
    border: none; border-radius: 12px; cursor: pointer;
    text-align: center; text-decoration: none;
    transition: all 0.2s; margin-top: 8px
  }
  .btn:active { transform: scale(0.98); background: #d4983c }
  .btn-outline {
    background: transparent; border: 2px solid #1B2B4B; color: #1B2B4B
  }
  .btn-outline:active { background: #f0f2f5 }

  .progress-bar {
    height: 6px; background: #e0e0e0; border-radius: 3px; margin-bottom: 20px
  }
  .progress-fill {
    height: 100%; background: #E8A84C; border-radius: 3px;
    transition: width 0.4s ease
  }

  .secao-titulo {
    font-size: 11px; font-weight: 700; color: #E8A84C;
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px
  }
  .titulo { font-size: 22px; font-weight: 800; color: #1B2B4B; margin-bottom: 8px }
  .subtitulo { font-size: 14px; color: #666; line-height: 1.5; margin-bottom: 20px }

  .pergunta-card {
    background: #f8f9fa; border-radius: 12px;
    padding: 16px; margin-bottom: 12px
  }
  .pergunta-texto {
    font-size: 14px; font-weight: 600; color: #1B2B4B;
    margin-bottom: 12px; line-height: 1.5
  }
  .opcao {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; background: white;
    border: 2px solid #e8ecf0; border-radius: 10px;
    margin-bottom: 8px; cursor: pointer;
    transition: all 0.15s; font-size: 14px; color: #333
  }
  .opcao input[type=radio] { display: none }
  .opcao .radio-circle {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #ccc; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s
  }
  .opcao:has(input:checked) {
    border-color: #1B2B4B; background: rgba(27,43,75,0.05)
  }
  .opcao:has(input:checked) .radio-circle {
    background: #1B2B4B; border-color: #1B2B4B
  }
  .opcao:has(input:checked) .radio-circle::after {
    content: ''; width: 8px; height: 8px;
    background: white; border-radius: 50%; display: block
  }

  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700; text-transform: uppercase
  }
  .badge-critico  { background: #fde8e8; color: #e74c3c }
  .badge-atencao  { background: #fef3cd; color: #e67e22 }
  .badge-saudavel { background: #d5f5e3; color: #27ae60 }
  .badge-urgente  { background: #f5b7b1; color: #c0392b }

  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; margin: 0 auto 16px;
    border: 6px solid currentColor
  }
  .score-number { font-size: 36px; font-weight: 800; line-height: 1 }
  .score-label  { font-size: 11px; color: #666 }

  textarea {
    width: 100%; padding: 14px; border: 2px solid #e8ecf0;
    border-radius: 12px; font-size: 14px; font-family: inherit;
    resize: vertical; min-height: 120px; outline: none;
    transition: border-color 0.15s
  }
  textarea:focus { border-color: #1B2B4B }

  .empresa-tag {
    background: rgba(232,168,76,0.15); border: 1px solid #E8A84C;
    color: #1B2B4B; padding: 6px 14px; border-radius: 20px;
    font-size: 13px; font-weight: 600; display: inline-block; margin-bottom: 16px
  }
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header-logo">● Pulso Gestão</div>
    <div class="header-sub">Diagnóstico Empresarial</div>
  </div>
  {% block header_right %}{% endblock %}
</div>
{% block content %}{% endblock %}
</body>
</html>
